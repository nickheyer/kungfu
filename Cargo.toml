[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nickheyer/kungfu"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
half = { version = "2", features = ["serde"] }
bincode = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["loader", "json"] }
axum = "0.8"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }

kf-core = { path = "crates/kf-core" }
kf-quant = { path = "crates/kf-quant" }
kf-gguf = { path = "crates/kf-gguf" }
kf-layers = { path = "crates/kf-layers" }
kf-arch = { path = "crates/kf-arch" }
kf-backend-cpu = { path = "crates/kf-backend-cpu" }
kf-backend-cuda = { path = "crates/kf-backend-cuda" }
kf-engine = { path = "crates/kf-engine", default-features = false }
kf-serve = { path = "crates/kf-serve", default-features = false }
kf-vision = { path = "crates/kf-vision" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 1
